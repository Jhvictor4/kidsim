<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #1E1A16; font-family: "Montserrat", sans-serif; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #1E1A16; }
      .glow { position: absolute; width: 1400px; height: 1400px; left: 260px; top: -160px; border-radius: 50%;
        background: radial-gradient(circle, rgba(217,119,43,0.22) 0%, rgba(217,119,43,0) 62%); }
      .ghost { position: absolute; right: -40px; bottom: -70px; font-size: 360px; font-weight: 800; color: #F6F1E7; opacity: 0.04; letter-spacing: -8px; }
      .card { position: absolute; left: 200px; top: 190px; width: 1520px; height: 700px; background: #F6F1E7; border-radius: 36px;
        box-sizing: border-box; padding: 96px 120px; display: flex; flex-direction: column; justify-content: center; gap: 30px; }
      .eyebrow { font-size: 30px; font-weight: 800; letter-spacing: 3px; color: #B85F1C; }
      .h1 { font-size: 92px; font-weight: 800; line-height: 1.04; color: #211C17; max-width: 1280px; letter-spacing: -1.5px; }
      .h2 { font-family: "Fraunces", serif; font-style: italic; font-size: 72px; color: #B85F1C; max-width: 1280px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="title" data-start="0" data-duration="7" data-width="1920" data-height="1080">
      <div class="glow" id="glow"></div>
      <div class="ghost" id="ghost">SIMULATE</div>
      <div class="card" id="card">
        <div class="eyebrow" id="eyebrow">KIDSIM — ISAAC SIM FOR CHILDREN</div>
        <div class="h1" id="h1">Robots rehearse in a simulator before the real world.</div>
        <div class="h2" id="h2">Kids don't get one.</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from("#glow", { scale: 0.85, opacity: 0, duration: 1.2, ease: "sine.out" }, 0.1);
      tl.to("#glow", { scale: 1.06, duration: 5.6, ease: "sine.inOut" }, 1.3);
      tl.from("#ghost", { x: 120, opacity: 0, duration: 1.4, ease: "power2.out" }, 0.1);
      tl.to("#ghost", { x: -80, duration: 5.4, ease: "none" }, 1.5);
      tl.from("#card", { y: 60, opacity: 0, duration: 0.7, ease: "power3.out" }, 0.15);
      tl.from("#eyebrow", { x: -30, opacity: 0, duration: 0.5, ease: "expo.out" }, 0.45);
      tl.from("#h1", { y: 40, opacity: 0, duration: 0.7, ease: "power3.out" }, 0.6);
      tl.from("#h2", { y: 30, opacity: 0, scale: 0.97, duration: 0.6, ease: "back.out(1.2)" }, 3.6);
      window.__timelines["title"] = tl;
    </script>
  </body>
</html>
